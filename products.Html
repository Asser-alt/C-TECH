    <!-- JavaScript -->
    <script>
        function addToCart(productName) {

            // نجيب الكارت القديم
            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            // نضيف المنتج
            cart.push(productName);

            // نخزن تاني
            localStorage.setItem("cart", JSON.stringify(cart));

            alert("تم إضافة المنتج للكارت ✅");
        }
    </script>
